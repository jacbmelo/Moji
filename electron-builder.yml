appId: com.jacbmelo.mojiplus
productName: Moji Plus
# Moji Plus is a derivative of Moji (https://github.com/alexishida/Moji) by Alex Ishida, MIT.
copyright: Copyright © 2026 João Melo. Based on Moji, Copyright © 2026 Alex Ishida
directories:
  output: release
  buildResources: build
publish:
  provider: github
  owner: jacbmelo
  repo: Moji
  # CI keeps release hidden until every platform artifact is uploaded.
  releaseType: draft
files:
  - out/**/*
  - package.json
  - samples/**/*
extraResources:
  - from: build/plus/icon.png
    to: icon.png
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    description: Markdown Document
    role: Editor
    mimeType: text/markdown
mac:
  icon: build/plus/icon.png
  category: public.app-category.productivity
  darkModeSupport: true
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Signing is driven by electron-builder's CSC_* environment variables. Unsigned
  # local builds still run; Gatekeeper only blocks copies downloaded from the web.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/plus/icon.png
  artifactName: ${productName}.Setup.${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  # No email on purpose: the maintainer is identified by the GitHub profile.
  maintainer: João Melo (https://github.com/jacbmelo)
  synopsis: Clean Markdown viewer and editor
  description: Moji Plus, based on Moji by Alex Ishida, is a desktop app for opening, reading, editing, and exporting Markdown files with split preview/editing, outline navigation, localized UI, and PDF, HTML, and PNG export.
  icon: build/plus/icons
  syncDesktopName: true
  extraFiles:
    - from: build/linux/moji-plus.desktop
      to: usr/share/applications/moji-plus.desktop
  desktop:
    entry:
      Keywords: Markdown;Editor;Viewer;Documents;Notes;
  target:
    - AppImage
    - deb
  category: Office
  mimeTypes:
    - text/markdown
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    entry:
      X-AppImage-Repository: https://github.com/jacbmelo/Moji
      X-AppImage-Author: João Melo
      X-AppImage-Homepage: https://github.com/jacbmelo/Moji
      X-AppImage-Description: Moji Plus, based on Moji by Alex Ishida, is a desktop app for opening, reading, editing, and exporting Markdown files with split preview/editing, outline navigation, localized UI, and PDF, HTML, and PNG export.
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
  packageCategory: editors
  fpm:
    - --deb-field
    - "Repository: https://github.com/jacbmelo/Moji"
    - --deb-field
    - "Author: João Melo"
    - --deb-field
    - "Vcs-Browser: https://github.com/jacbmelo/Moji"
    - --deb-field
    - "Vcs-Git: https://github.com/jacbmelo/Moji.git"
    - "build/metainfo/com.jacbmelo.mojiplus.metainfo.xml=/usr/share/metainfo/com.jacbmelo.mojiplus.metainfo.xml"
