appId: com.jacbmelo.mojiplus
productName: Moji Plus
# Moji Plus is a derivative of Moji (https://github.com/alexishida/Moji) by Alex Ishida, MIT.
copyright: Copyright © 2026 João Melo. Based on Moji, Copyright © 2026 Alex Ishida
directories:
  output: release
  buildResources: build
publish:
  provider: github
  owner: jacbmelo
  repo: Moji
  # CI keeps release hidden until every platform artifact is uploaded.
  releaseType: draft
files:
  - out/**/*
  - package.json
  - samples/**/*
extraResources:
  - from: build/plus/icon.png
    to: icon.png
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    description: Markdown Document
    role: Editor
    mimeType: text/markdown
# Artifact names avoid the space in productName: GitHub renames release assets with spaces,
# which would break the file names electron-updater reads from latest*.yml.
mac:
  icon: build/plus/icon.png
  category: public.app-category.productivity
  darkModeSupport: true
  # No CFBundleName override: Electron finds its helper apps by the bundle name
  # ("<CFBundleName> Helper.app"), so "Moji+" there makes the app crash at launch (1.5.0).
  artifactName: Moji-Plus-${version}-${arch}.${ext}
  # Signing is driven by electron-builder's CSC_* environment variables. Unsigned
  # local builds still run; Gatekeeper only blocks copies downloaded from the web.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Moji Plus: the other types it opens are offered in "Open With" without claiming them
  # (rank Alternate). Not on Windows, where NSIS would make the app the handler of .txt.
  fileAssociations:
    - ext: [mdown, mkd, mkdn, markdn, mdx]
      name: Markdown Document
      role: Editor
      rank: Alternate
    - ext: txt
      name: Plain Text Document
      role: Editor
      rank: Alternate
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
dmg:
  artifactName: Moji-Plus-${version}-${arch}.${ext}
  # Volume icon of the mounted DMG: the app icon with an install badge (npm run icons).
  icon: build/plus/installer.icns
win:
  icon: build/plus/icon.png
  artifactName: Moji-Plus.Setup.${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  # Setup and uninstaller icons: the app icon with an install or remove badge (npm run icons).
  installerIcon: build/plus/installer.ico
  installerHeaderIcon: build/plus/installer.ico
  uninstallerIcon: build/plus/uninstaller.ico
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  # No email on purpose: the maintainer is identified by the GitHub profile.
  maintainer: João Melo (https://github.com/jacbmelo)
  synopsis: Clean Markdown viewer and editor
  description: Moji+, based on Moji by Alex Ishida, is a desktop app for opening, reading, editing, and exporting Markdown files with split preview/editing, outline navigation, localized UI, and PDF, HTML, and PNG export.
  icon: build/plus/icons
  syncDesktopName: true
  extraFiles:
    - from: build/linux/moji-plus.desktop
      to: usr/share/applications/moji-plus.desktop
  desktop:
    entry:
      Keywords: Markdown;Editor;Viewer;Documents;Notes;
  # x64 on any build machine (the upstream builds on Linux x64; cross-builds from Apple silicon default to arm64).
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  mimeTypes:
    - text/markdown
    - text/plain
appImage:
  artifactName: Moji-Plus-${version}-${arch}.${ext}
  desktop:
    entry:
      X-AppImage-Repository: https://github.com/jacbmelo/Moji
      X-AppImage-Author: João Melo
      X-AppImage-Homepage: https://github.com/jacbmelo/Moji
      X-AppImage-Description: Moji+, based on Moji by Alex Ishida, is a desktop app for opening, reading, editing, and exporting Markdown files with split preview/editing, outline navigation, localized UI, and PDF, HTML, and PNG export.
deb:
  artifactName: Moji-Plus-${version}-${arch}.${ext}
  packageCategory: editors
  fpm:
    - --deb-field
    - "Repository: https://github.com/jacbmelo/Moji"
    - --deb-field
    - "Author: João Melo"
    - --deb-field
    - "Vcs-Browser: https://github.com/jacbmelo/Moji"
    - --deb-field
    - "Vcs-Git: https://github.com/jacbmelo/Moji.git"
    - "build/metainfo/com.jacbmelo.mojiplus.metainfo.xml=/usr/share/metainfo/com.jacbmelo.mojiplus.metainfo.xml"
